name: Downloads badge

# Counts installer downloads only; latest.json and .sig files are fetched by the updater.

on:
  schedule:
    - cron: "0 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Count installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '[.[].assets[] | select(.name | test("[.](exe|AppImage|deb|rpm)$")) | .download_count] | add // 0' \
            | awk '{s+=$1} END {print s+0}')
          mkdir -p out
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"FF6A45"}\n' "$total" > out/downloads.json
          cat out/downloads.json

      - name: Publish to the badges branch
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "Update downloads badge"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
