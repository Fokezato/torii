name: Build

# Tags attach unsigned installers to a draft release; updater signing and
# publishing happen locally (scripts/sign-release.mjs).

on:
  push:
    branches: [main, linux-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # Oldest supported glibc for the AppImage.
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libx11-dev libxdo-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash

      # Bundled libwayland breaks WebKit on newer Mesa (EGL_BAD_PARAMETER).
      - name: Drop bundled libwayland from the AppImage
        if: matrix.name == 'linux'
        working-directory: src-tauri/target/release/bundle/appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          f=$(ls *.AppImage)
          ./"$f" --appimage-extract > /dev/null
          rm -f squashfs-root/usr/lib/libwayland-*
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm "$f"
          ARCH=x86_64 ./appimagetool squashfs-root "$f"
          rm -rf squashfs-root appimagetool

      - uses: actions/upload-artifact@v4
        with:
          name: torii-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Torii ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
