[package]
name = "torii"
version = "0.6.0"
description = "Your anime hub"
authors = ["Fokezato"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "torii_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls", "migrate", "macros"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
feed-rs = "2"
scraper = "0.20"
regex = "1"
rustfft = "6"
futures = "0.3"
quick-xml = { version = "0.36", features = ["serialize"] }
urlencoding = "2"
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
librqbit = "9"
anyhow = "1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
libloading = "0.8"
jpeg-encoder = "0.6"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
discord-rich-presence = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2", features = ["xlib"] }
raw-window-handle = "0.6"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_System_WinRT",
    "Media",
    "Foundation",
] }


# Keeps file:line in panics without full debug info (dev builds grew to 40GB).
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
